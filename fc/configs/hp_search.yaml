base_overrides: {}

search:
  optimizer_name: AdamW
  learning_rates: [3.0e-5, 1.0e-4, 3.0e-4]
  weight_decays: [0.0, 1.0e-5, 1.0e-4, 5.0e-4]
  use_cosine_annealing: [false, true]
  cosine_annealing:
    eta_min: 1.0e-6
  subset:
    train_fraction: 0.5
    val_fraction: 0.5
  subset_splits_filename: hp_search_splits.json
  rerun:
    top_k: 3
  artifacts_root: /home/finperprint-analysis/fc/outputs/hp_search
  results_filename: hp_search.json
  log_filename: hp_search.log