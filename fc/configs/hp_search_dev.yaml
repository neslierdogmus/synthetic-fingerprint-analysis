base_overrides: {}

search:
  optimizer_name: AdamW
  learning_rates: [3.0e-5, 1.0e-4]
  weight_decays: [1.0e-4]
  use_cosine_annealing: [false, true]
  cosine_annealing:
    eta_min: 1.0e-6
  subset:
    train_fraction: 0.25
    val_fraction: 0.25
  subset_splits_filename: hp_search_splits_dev.json
  rerun:
    top_k: 1
  artifacts_root: /home/finperprint-analysis/fc/outputs_dev/hp_search
  results_filename: hp_search.json
  log_filename: hp_search.log
