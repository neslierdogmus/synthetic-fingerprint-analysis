output_dir: /home/finperprint-analysis/fc/outputs_dev

protocol:
  seed: 42
  num_folds: 2
  test_size: 0.2
  split_filename: real_splits_dev.json

batch_size: 8
num_workers: 0
dataset:
  name: nist_sd04
  root: /home/finperprint-analysis/datasets/fc
  img_num: 200
train:
  num_epochs: 12
  eval_interval: 4
  loss_function:
    name: BCEWithLogitsLoss
  optimizer:
    name: SGD
    learning_rate: 0.001
    weight_decay: 0.0001
    momentum: 0.9
  scheduler:
    name: step_lr
    step_size: 30
    gamma: 0.1
  early_stopping:
    patience: 4
    min_delta: 0.001
  resume:
    enabled: false
  augmentation:
    horizontal_flip: true
    rotation_degrees: 20
    brightness: 0.15
    contrast: 0.15
    gaussian_blur:
      enabled: true
      probability: 0.3
      kernel_size: 3
      sigma: [0.1, 1.0]

eval:
  dataset:
    name: nist_sd04
    root: ../../datasets/fc
  metrics:
    - name: accuracy
      params:
        top_k: [1, 5]
    - name: precision
      params:
        average: 'macro'
    - name: recall
      params:
        average: 'macro'
    - name: f1_score
      params:
        average: 'macro'
    - name: confusion_matrix
      params:
        normalize: true
    - name: roc_auc
      params:
        average: 'macro'
    - name: classification_report
      params:
        target_names: ['class_0', 'class_1', 'class_2', 'class_3', 'class_4']
    - name: roc_curve
      params:
        num_thresholds: 1000

model:
  name: efficientnet_b4
  pretrained: true
  weights: IMAGENET1K_V1
  num_classes: 5
