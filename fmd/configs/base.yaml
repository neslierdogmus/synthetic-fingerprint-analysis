output_dir: /home/finperprint-analysis/fmd/outputs
protocol:
  seed: 42
  num_folds: 5
  test_size: 0.2
  split_filename: real_splits.json

batch_size: 4
num_workers: 0

dataset:
  name: fmd
  root: /home/finperprint-analysis/datasets/fmd
  img_num: 400

model:
  name: convnet
  size: 8

train:
  num_epochs: 101
  eval_interval: 10
  loss_function:
    name: BCEWithLogitsLoss
  optimizer:
    name: SGD
    learning_rate: 0.01
    weight_decay: 0.0001
    momentum: 0.9
  scheduler:
    name: step_lr
    step_size: 30
    gamma: 0.1
  early_stopping:
    patience: 10
    min_delta: 0.001
  resume:
    enabled: false

eval:
  nms_min_distance: 3
  radii: [5, 10, 15]