services:
  fingerprint-analysis:
    build:
      context: .
    image: fpa:latest
    container_name: fpa
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../src:/home/finperprint-analysis/src
      - /mnt/data/Datasets/Finger/FOESamples:/home/finperprint-analysis/datasets/foe
      - ../foe/src:/home/finperprint-analysis/foe/src
      - ../foe/configs:/home/finperprint-analysis/foe/configs
      - ../foe/outputs:/home/finperprint-analysis/foe/outputs
      - /mnt/data/Datasets/Finger/NIST_SD4:/home/finperprint-analysis/datasets/fc
      - ../fc/src:/home/finperprint-analysis/fc/src
      - ../fc/configs:/home/finperprint-analysis/fc/configs
      - ../fc/outputs:/home/finperprint-analysis/fc/outputs
      - /mnt/data/Datasets/Finger/FVC_BERKAY_TOPCU:/home/finperprint-analysis/datasets/fmd
      - ../fmd/src:/home/finperprint-analysis/fmd/src
      - ../fmd/configs:/home/finperprint-analysis/fmd/configs
      - ../fmd/outputs:/home/finperprint-analysis/fmd/outputs
    init: true
    stdin_open: true
    tty: true

    # Overrides default command so things don't shut down after the process ends.
    # entrypoint: /usr/local/share/docker-init.sh
    # command: sleep infinity 

    # Uncomment the next four lines if you will use a ptrace-based debuggers like C++, Go, and Rust.
    # cap_add:
    #  - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

