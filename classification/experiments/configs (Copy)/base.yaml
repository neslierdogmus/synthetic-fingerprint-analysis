num_folds: 5
batch_size: 16
num_workers: 4
train:
  dataset:
    name: nist_sd04
    root: ../../datasets/fc
  num_epochs: 100
  loss_function: "CrossEntropyLoss"
  optimizer: 
    name: sgd
    learning_rate: 0.001
    weight_decay: 0.0001
    momentum: 0.9
  scheduler:
    name: step_lr
    step_size: 30
    gamma: 0.1
  early_stopping:
    patience: 10
    min_delta: 0.001
  augmentation:
    - name: random_crop
      params:
        size: 224
    - name: random_flip
      params:
        horizontal: true
        vertical: false
    - name: normalize
      params:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - name: random_rotation 
      params:
        degrees: 15
    - name: color_jitter
      params:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.1
    - name: gaussian_blur
      params:
        kernel_size: 3
        sigma: [0.1, 2.0]
    - name: random_affine
      params:
        degrees: 15
        translate: [0.1, 0.1]
        scale: [0.8, 1.2]
        shear: [0, 10]
        fillcolor: 0
    - name: random_resized_crop
      params:
        size: 224
        scale: [0.08, 1.0]
        ratio: [3.0, 3.0]
        interpolation: 2
eval:
  dataset:
    name: nist_sd04
    root: ../../datasets/fc
  metrics:
    - name: accuracy
      params:
        top_k: [1, 5]
    - name: precision
      params:
        average: 'macro'
    - name: recall
      params:
        average: 'macro'
    - name: f1_score
      params:
        average: 'macro'
    - name: confusion_matrix
      params:
        normalize: true
    - name: roc_auc
      params:
        average: 'macro'
    - name: classification_report
      params:
        target_names: ['class_0', 'class_1', 'class_2', 'class_3', 'class_4']
    - name: roc_curve
      params:
        num_thresholds: 1000


model:
  name: resnet18
  weights: IMAGENET1K_V1
  num_classes: 5  

output:
  model_dir: '../../output/models/fc'
  log_dir: '../../output/logs/fc'
  checkpoint_dir: '../../output/checkpoints/fc'
  results_dir: '../../output/results/fc'